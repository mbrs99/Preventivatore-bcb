<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';">
  <title>Preventivatore BCB</title>
  <style>
    :root {
      --navy: #1d3a5f;
      --beige: #b3a082;
      --bg: #f8f7f4;
      --card: #ffffff;
      --border: #e5e1d8;
      --text: #2a2a2a;
      --muted: #6b6560;
      --accent: #1d3a5f;
      --shadow: rgba(29, 58, 95, 0.12);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100%;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      padding: 28px 32px 24px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 24px;
    }

    .logo {
      width: 52px; height: 52px;
      background: var(--navy);
      color: white;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800;
      font-size: 22px;
      font-family: Georgia, serif;
      letter-spacing: 1px;
      box-shadow: 0 3px 10px var(--shadow);
    }

    h1 {
      margin: 0;
      font-size: 22px;
      color: var(--navy);
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    h1 small {
      display: block;
      font-size: 12px;
      color: var(--muted);
      font-weight: 400;
      margin-top: 3px;
      text-transform: uppercase;
      letter-spacing: 1.2px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 18px;
    }

    .btn {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px 18px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 6px;
      text-align: left;
      transition: all 0.15s ease;
      font-family: inherit;
      color: var(--text);
      min-height: 96px;
    }

    .btn:hover {
      border-color: var(--navy);
      box-shadow: 0 4px 14px var(--shadow);
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
      box-shadow: 0 1px 4px var(--shadow);
    }

    .btn.primary {
      background: var(--navy);
      color: white;
      border-color: var(--navy);
      grid-column: 1 / -1;
      min-height: 82px;
    }

    .btn.primary:hover {
      background: #162d4a;
      border-color: #162d4a;
    }

    .btn-icon {
      font-size: 22px;
      line-height: 1;
    }

    .btn-title {
      font-weight: 600;
      font-size: 14px;
    }

    .btn-desc {
      font-size: 11.5px;
      color: var(--muted);
      line-height: 1.35;
    }

    .btn.primary .btn-desc {
      color: rgba(255, 255, 255, 0.85);
    }

    .divider {
      border: 0;
      border-top: 1px solid var(--border);
      margin: 16px 0 14px;
    }

    .section-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.3px;
      color: var(--muted);
      font-weight: 600;
      margin-bottom: 8px;
    }

    .small-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn-small {
      background: transparent;
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      cursor: pointer;
      font-size: 12.5px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s ease;
      font-family: inherit;
      text-align: left;
    }

    .btn-small:hover {
      border-color: var(--navy);
      background: var(--card);
      border-style: solid;
    }

    footer {
      margin-top: auto;
      padding-top: 12px;
      font-size: 10.5px;
      color: var(--muted);
      text-align: center;
      border-top: 1px solid var(--border);
      word-break: break-all;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--navy);
      color: white;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13px;
      box-shadow: 0 8px 24px var(--shadow);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 100;
    }

    .toast.visible {
      opacity: 1;
    }

    .toast.error {
      background: #991b1b;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">BCB</div>
    <h1>
      Preventivatore
      <small>Studio Commercialista BCB</small>
    </h1>
  </header>

  <main>
    <div class="grid">
      <button class="btn primary" id="btn-open-preventivatore">
        <div class="btn-icon">📋</div>
        <div class="btn-title">Apri Preventivatore</div>
        <div class="btn-desc">Genera un nuovo preventivo o modificane uno esistente</div>
      </button>

      <button class="btn" id="btn-open-clienti">
        <div class="btn-icon">👥</div>
        <div class="btn-title">Cartella Clienti</div>
        <div class="btn-desc">Apri la cartella dei clienti salvati (ogni cliente è un file .json)</div>
      </button>

      <button class="btn" id="btn-open-editor">
        <div class="btn-icon">💼</div>
        <div class="btn-title">Editor Tariffario</div>
        <div class="btn-desc">Modifica visualmente le tariffe e aggiungi nuove voci personalizzate</div>
      </button>

      <button class="btn" id="btn-open-codice" style="grid-column: 1 / -1;">
        <div class="btn-icon">🗂️</div>
        <div class="btn-title">Cartella Codice / File operativi</div>
        <div class="btn-desc">Accedi ai file di lavoro del tool (sorgenti, backup, documenti di riferimento)</div>
      </button>
    </div>

    <hr class="divider" />

    <div class="section-label">Condividi con altri collaboratori</div>
    <div class="small-grid">
      <button class="btn-small" id="btn-export">
        <span>📤</span>
        <span>Esporta lista clienti</span>
      </button>
      <button class="btn-small" id="btn-import">
        <span>📥</span>
        <span>Importa lista clienti</span>
      </button>
    </div>
  </main>

  <footer id="footer">
    Cartella dati in caricamento...
  </footer>

  <div class="toast" id="toast"></div>

  <script src="home.js"></script>
</body>
</html>
